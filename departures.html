<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aktuální odjezdy | DPMA</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            DPMA
        </div>

        <nav>
            <a href="index.html">Úvod</a>
            <a href="departures.html" class="active">
                Odjezdy
            </a>
            <a href="lines.html">
                Linky
            </a>
            <a href="vehicles.html">
                Vozidla
            </a>
        </nav>

    </header>


    <main class="container">

        <section class="page-title">

            <h1>Aktuální odjezdy</h1>

            <p>
                Vyber zastávku a zobrazí se nejbližší spoje.
            </p>

        </section>


        <!-- VÝBĚR ZASTÁVKY -->

        <section class="stop-selector">

            <label for="stopSelect">
                Zastávka
            </label>

            <select id="stopSelect">

                <option value="">
                    Vyber zastávku...
                </option>

            </select>

            <button id="refreshButton">
                ↻ Aktualizovat
            </button>

        </section>


        <!-- ODPČET -->

        <section class="status">

            <span id="systemStatus">
                Načítám systém...
            </span>

            <span id="lastUpdate"></span>

        </section>


        <!-- ODJEDY -->

        <section
            id="departuresContainer"
            class="departures-container"
        >

            <div class="loading">
                Načítám odjezdy...
            </div>

        </section>

    </main>


    <footer>

        <p>
            DPMA Online · Informační systém MHD
        </p>

    </footer>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="js/vehicles.js"></script>
    <script src="js/trips.js"></script>
    <script src="js/timetable.js"></script>
    <script src="js/departures.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
