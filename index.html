<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DPMA Online – Aktuální odjezdy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        DPMA
        <span>ONLINE</span>
    </div>

    <div class="clock">
        <div id="currentTime">--:--:--</div>
        <div id="currentDate">--.--.----</div>
    </div>

</header>


<main>

    <section class="search-section">

        <h1>Aktuální odjezdy</h1>

        <p class="subtitle">
            Vyberte zastávku
        </p>

        <select id="stopSelect">
            <option value="">Vyberte zastávku...</option>
        </select>

    </section>


    <section id="stopPanel" class="stop-panel hidden">

        <div class="stop-header">

            <div>
                <div class="small-title">
                    ZASTÁVKA
                </div>

                <h2 id="stopName">
                    --
                </h2>
            </div>

            <div id="lastUpdate">
                Aktualizováno: --
            </div>

        </div>


        <div id="departures">

            <div class="loading">
                Načítám odjezdy...
            </div>

        </div>

    </section>

</main>


<footer>

    <div>
        DPMA Online
    </div>

    <div>
        Fiktivní informační systém DPMA
    </div>

</footer>


<script src="js/clock.js"></script>
<script src="js/data.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/departures.js"></script>
<script src="js/app.js"></script>

</body>
</html>
